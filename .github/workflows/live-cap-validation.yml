name: Live CAP validation with IBGE reference data

on:
  push:
    branches: ["work/cap-validation-and-tests"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  live-cap-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate current CAP feed against IBGE reference boundaries
        run: python testar_alertas_regiao_ituverava.py --limites tests/fixtures/ibge-sp-municipios-api.geojson
