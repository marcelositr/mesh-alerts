name: Live CAP and IBGE reference validation

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-cap-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Validate current CAP feed against IBGE reference boundaries
        run: python -m mesh_alerts.region --boundaries tests/fixtures/ibge-sp-municipios-api.geojson

  ibge-live-probe:
    # Keep the external IBGE probe off every push. Run it only on a schedule
    # or when explicitly requested, so rapid development pushes do not hammer
    # the endpoint or make the normal validation depend on runner networking.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Probe live IBGE API availability (warning only)
        run: |
          python - <<'PY'
          from mesh_alerts.config import load_config, municipality_map
          from mesh_alerts.region import carregar_limites

          config = load_config()
          try:
              carregar_limites(
                  municipality_map(config),
                  config["fontes"]["malhas_ibge"],
                  timeout=20,
                  tentativas=2,
              )
          except Exception as exc:
              print(f"::warning::IBGE live probe failed: {exc}")
          else:
              print("IBGE live probe succeeded.")
          PY
