name: Live CAP and IBGE reference validation

on:
  push:
    branches: ["work/integrate-python-package", "work/production-hardening"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-cap-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Validate current CAP feed against IBGE reference boundaries
        run: python -m mesh_alerts.region --boundaries tests/fixtures/ibge-sp-municipios-api.geojson
      - name: Probe live IBGE API availability (non-blocking)
        continue-on-error: true
        run: |
          python -c 'from mesh_alerts.config import load_config, municipality_map; from mesh_alerts.region import carregar_limites; c = load_config(); carregar_limites(municipality_map(c), c["fontes"]["malhas_ibge"], timeout=8, tentativas=1)'
