name: Python security and quality

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and analysis tools
        run: |
          python -m pip install -e .
          python -m pip install ruff bandit pip-audit
      - name: Check Python code with Ruff
        run: ruff check --output-format=github --select E4,E7,E9,F src tests
      - name: Scan Python source with Bandit
        run: bandit -r src -ll
      - name: Audit installed dependencies
        run: pip-audit -r requirements.txt
