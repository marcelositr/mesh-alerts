# Configuração principal do mesh-alerts.
# Copie e edite este arquivo para adaptar o serviço à sua região.
# Os códigos IBGE devem ser strings de sete dígitos.

regiao:
  nome: "Região de Ituverava"
  estado: "São Paulo"
  uf: "SP"

municipios:
  - nome: "Aramina"
    codigo_ibge: "3503000"
    uf: "SP"
  - nome: "Buritizal"
    codigo_ibge: "3508207"
    uf: "SP"
  - nome: "Guará"
    codigo_ibge: "3517703"
    uf: "SP"
  - nome: "Igarapava"
    codigo_ibge: "3520103"
    uf: "SP"
  - nome: "Ituverava"
    codigo_ibge: "3524105"
    uf: "SP"
  - nome: "Miguelópolis"
    codigo_ibge: "3529708"
    uf: "SP"

meshtastic:
  host: "meshtastic-node.local"
  porta: 4403
  canal: 2
  destino: "^all"

servico:
  intervalo_segundos: 60
  banco: "data/mesh-alerts.sqlite3"
  diretorio_txt: "output"
  nivel_log: "INFO"
  timeout_http_segundos: 25
  tentativas_feed: 3
  tentativas_malha_ibge: 2
  limite_mensagem_caracteres: 220

fontes:
  feed_cap: "https://idapfile.mdr.gov.br/idap/api/rss/cap"
  malhas_ibge: "https://servicodados.ibge.gov.br/api/v3/malhas/municipios"

inmet:
  canal: 1
  previsao_url: "https://apiprevmet3.inmet.gov.br/previsao"
  fuso_horario: "America/Sao_Paulo"
  timeout_segundos: 30
  janela_recuperacao_minutos: 30
  horarios:
    "06:00": "manha"
    "12:00": "tarde"
    "18:00": "noite"
  intervalo_entre_mensagens_segundos: 3
  intervalo_entre_municipios_segundos: 30

